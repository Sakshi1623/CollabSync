server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Serve matching static files directly; otherwise fall back to index.html
  # so React Router handles client-side routes (/login, /dashboard, /admin, etc.)
  location / {
    try_files $uri $uri/ /index.html;
  }
}


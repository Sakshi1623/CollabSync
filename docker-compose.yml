services:
  # Local MongoDB container for Docker (completely separate from MongoDB Atlas in server/.env)
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express + Socket.IO backend API
  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Connects to the local Docker mongo service above, not MongoDB Atlas
      MONGO_URI: mongodb://mongo:27017/collabsync
      # Fails immediately if JWT_SECRET is missing or empty in the root .env file
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing or empty. Copy .env.example to .env and set a strong JWT_SECRET.}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # React + Vite frontend served by Nginx
  client:
    build:
      context: ./client
      args:
        # Baked into the Vite bundle at build time for browser requests on the host
        VITE_API_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:

